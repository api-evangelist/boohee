aid: boohee
name: Boohee
description: 'Boohee (薄荷健康) is a Chinese consumer health-technology company focused on scientific
  weight management, serving a cumulative 180 million users over its ~17-year history. Its portfolio spans
  the Boohee Health mobile app (calorie and food tracking, diet and exercise logging, AI weight-management
  coaching, meal plans, smart body scales, community), Boohee Life nutritional foods and subscription
  services, the Boohee Life Internet Hospital (Tianjin-based telemedicine for internal and traditional
  Chinese medicine), and a Boohee weight-loss SaaS platform that helps hospitals stand up weight-management
  clinics. The company operates as a consumer mobile and content platform and does not publish a public
  developer API or open platform; this profile is maintained in the API Evangelist network as a portfolio
  lead of DCM Ventures.'
